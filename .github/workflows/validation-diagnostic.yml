name: Validation diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install quietly
        run: |
          python -m pip install --upgrade pip --quiet
          python -m pip install -e ".[dev,z3]" --quiet
      - name: Capture security regressions
        id: security
        shell: bash
        run: |
          set +e
          python -m pytest -q -m security --tb=short > security-regressions.log 2>&1
          status=$?
          echo "$status" > security-regressions.status
          cat security-regressions.log
          exit 0
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-regressions-log
          path: |
            security-regressions.log
            security-regressions.status
      - name: Preserve pytest conclusion
        shell: bash
        run: exit "$(cat security-regressions.status)"
