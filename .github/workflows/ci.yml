name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.11
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,z3]"

      - name: CLI smoke
        run: |
          python -m belief --help
          python -m belief scan --help

      - name: Python source classification
        run: python -m belief.source_classification --root .

      - name: Security regressions
        run: python -m pytest -q -m security

      - name: Local test suite
        run: python -m pytest -q -m "not slow and not external and not llm"
