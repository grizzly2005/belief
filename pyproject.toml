[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "belief-sec"
version = "0.2.0"
description = "Belief Extraction and Logical Inference for Exploitable Flaws"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "httpx>=0.25.0",
]

[project.optional-dependencies]
z3 = ["z3-solver>=4.12.0"]
multilang = [
    "tree-sitter>=0.23,<0.24",
    "tree-sitter-javascript>=0.23,<0.24",
    "tree-sitter-typescript>=0.23,<0.24",
    "tree-sitter-go>=0.23,<0.24",
    "tree-sitter-java>=0.23,<0.24",
    "tree-sitter-rust>=0.23,<0.24",
]
web-validation = [
    "Flask>=3.0,<4",
    "fastapi>=0.115,<1",
    "requests>=2.31,<3",
]
full = [
    "z3-solver>=4.12.0",
    "hypothesis>=6.0.0",
    "tree-sitter>=0.23,<0.24",
    "tree-sitter-javascript>=0.23,<0.24",
    "tree-sitter-typescript>=0.23,<0.24",
    "tree-sitter-go>=0.23,<0.24",
    "tree-sitter-java>=0.23,<0.24",
    "tree-sitter-rust>=0.23,<0.24",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0,<0.16",
]

[project.scripts]
belief = "belief.cli:main"

[tool.setuptools.packages.find]
include = ["belief*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
belief = [
    "python_source_classification.json",
    "security_rules/**/*",
    "tools_bundled/**/*",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    "**/*_ref.py",
    "**/*_adapted/**",
    "**/z3_examples/**",
    "**/angr_examples/**",
    "**/pyt_adapted/**",
    "**/gitpython_adapted/**",
    "**/ossfuzz_adapted/**",
    "**/fastapi_adapted/**",
    "**/hypothesis_adapted/**",
    "**/monitoring_adapted/**",
    "**/cache_adapted/**",
    "**/rules_data.py",
    "**/examples/**",
    # Vendored/legacy runtime samples are retained as data, not first-party lint targets.
    "belief/tools_bundled/**",
    "belief/security_rules/**",
    "belief/semgrep_db/**",
    "tests/real_world_snippets/**",
]

[tool.ruff.lint]
ignore = ["E401", "E402", "E701", "E702", "E741", "E731"]

[tool.pytest.ini_options]
testpaths = ["tests", "tests_bridges"]
markers = [
    "unit: fast local unit tests",
    "integration: local integration tests without external network",
    "security: security pattern and finding regression tests",
    "slow: tests that are expected to take longer than the default suite",
    "llm: tests requiring an LLM provider",
    "external: tests requiring an external tool, service, or network",
]
